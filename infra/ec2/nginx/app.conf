upstream app_backend {
    server 127.0.0.1:4040;
    keepalive 32;
}

server {
    listen 80;
    server_name api-stg.snaplet.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api-stg.snaplet.site;

    ssl_certificate /etc/letsencrypt/live/api-stg.snaplet.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-stg.snaplet.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # SSE endpoints
    location ~* /stream$ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;        # ← quan trọng nhất, không có cái này event bị giữ lại
        proxy_cache off;
        proxy_read_timeout 3600s;   # ← tránh nginx đóng connection sau 60s
        proxy_set_header Connection '';  # ← giữ keepalive upstream
    }

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}