name: Deploy

on:
  push:
    branches: [staging, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm test

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref_name == 'staging'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Write sensitive files
        shell: bash
        run: |
          umask 077
          mkdir -p "${GITHUB_WORKSPACE}/infra/ec2/secrets"

          printf '%s' "${{ secrets.SERVICE_KEY_PEM }}" > "${GITHUB_WORKSPACE}/infra/ec2/secrets/snaplet-core-service-key.pem"
          test -s "${GITHUB_WORKSPACE}/infra/ec2/secrets/snaplet-core-service-key.pem"

          printf '%s' "${{ secrets.CONFIG_ENV }}" > "${GITHUB_WORKSPACE}/infra/ec2/config.env"
          test -s "${GITHUB_WORKSPACE}/infra/ec2/config.env"

          printf '%s' "${{ secrets.ENV }}" > "${GITHUB_WORKSPACE}/infra/ec2/.env"
          test -s "${GITHUB_WORKSPACE}/infra/ec2/.env"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run infra update
        shell: bash
        run: bash infra/ec2/scripts/update-service.sh
  
  deploy-prod:
    name: Deploy Master
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref_name == 'master'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Write sensitive files
        shell: bash
        run: |
          umask 077
          mkdir -p "${GITHUB_WORKSPACE}/infra/ec2/secrets"
          printf '%s' "${{ secrets.SERVICE_KEY_PEM }}" > "${GITHUB_WORKSPACE}/infra/ec2/secrets/snaplet-core-service-key.pem"
          test -s "${GITHUB_WORKSPACE}/infra/ec2/secrets/snaplet-core-service-key.pem"

          printf '%s' "${{ secrets.CONFIG_ENV }}" > "${GITHUB_WORKSPACE}/infra/ec2/config.env"
          test -s "${GITHUB_WORKSPACE}/infra/ec2/config.env"

          printf '%s' "${{ secrets.ENV }}" > "${GITHUB_WORKSPACE}/infra/ec2/.env"
          test -s "${GITHUB_WORKSPACE}/infra/ec2/.env"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Run infra update
        shell: bash
        run: bash infra/ec2/scripts/update-service.sh
