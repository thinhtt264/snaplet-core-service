name: Staging CI

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm exec eslint .

      - name: Run test
        run: pnpm test

  infra-update:
    name: Infra Update
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Load environment variables from secret
        shell: bash
        run: |
          umask 077
          printf '%s' "${{ secrets.CONFIG_ENV }}" > "${GITHUB_WORKSPACE}/config.env"
          test -s "${GITHUB_WORKSPACE}/config.env"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run infra update
        run: pnpm infra:update
