name: Deploy

on:
  push:
    branches: [staging, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm test

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref_name == 'staging'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Write sensitive files
        shell: bash
        run: |
          umask 077
          printf '%s' "${{ secrets.CONFIG_ENV }}" > "${GITHUB_WORKSPACE}/config.env"
          test -s "${GITHUB_WORKSPACE}/config.env"
          printf '%s' "${{ secrets.ENV }}" > "${GITHUB_WORKSPACE}/.env"
          test -s "${GITHUB_WORKSPACE}/.env"

      - name: Run infra update
        shell: bash
        run: bash infra/ec2/scripts/deploy.sh

  deploy-prod:
    name: Deploy Master
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref_name == 'master'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Write sensitive files
        shell: bash
        run: |
          umask 077
          printf '%s' "${{ secrets.CONFIG_ENV }}" > "${GITHUB_WORKSPACE}/config.env"
          test -s "${GITHUB_WORKSPACE}/config.env"
          printf '%s' "${{ secrets.ENV }}" > "${GITHUB_WORKSPACE}/.env"
          test -s "${GITHUB_WORKSPACE}/.env"

      - name: Run infra update
        shell: bash
        run: bash infra/ec2/scripts/deploy.sh
